name: Gerar imagens do site

on:
  push:
    branches: [main]
    paths:
      - 'assets-src/**'
      - '.github/workflows/build-assets.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Decodificar imagens WebP
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          for source in assets-src/*.webp.b64; do
            output="$(basename "$source" .b64)"
            base64 --decode "$source" > "$output"
          done

          hero_parts=(assets-src/hero-editorial.webp.b64.part*)
          if ((${#hero_parts[@]})); then
            cat "${hero_parts[@]}" | base64 --decode > hero-editorial.webp
          fi

      - name: Validar imagens geradas
        shell: python
        run: |
          from pathlib import Path

          required = [
              'hero-editorial.webp',
              'portrait.webp',
              'avatar-rafael.webp',
              'avatar-thalles.webp',
              'avatar-mayara.webp',
              'avatar-eric.webp',
              'avatar-bianca.webp',
              'avatar-mauro.webp',
              'avatar-gabriel.webp',
          ]

          for name in required:
              path = Path(name)
              if not path.exists():
                  raise SystemExit(f'Arquivo ausente: {name}')
              data = path.read_bytes()
              if len(data) < 100 or data[:4] != b'RIFF' or data[8:12] != b'WEBP':
                  raise SystemExit(f'WebP inválido: {name}')

          print('Todas as imagens foram geradas e validadas.')

      - name: Publicar imagens no repositório
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hero-editorial.webp portrait.webp avatar-*.webp
          if git diff --cached --quiet; then
            echo "Nenhuma alteração de imagem necessária."
          else
            git commit -m "Gera imagens otimizadas do site"
            git push
          fi
